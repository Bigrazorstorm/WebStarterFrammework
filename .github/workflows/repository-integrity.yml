name: Repository integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; review updates explicitly
        with:
          persist-credentials: false
      - name: Validate starter structure
        run: python3 scripts/check_repo.py
# Kein Deployment. Produktprüfungen und geschützte Umgebung nach ADR ergänzen.
